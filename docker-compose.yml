# One-command local run of the production images:
#
#   docker compose up --build        -> http://localhost:8080  (hr@acme.test / password123)
#
# First boot migrates the database and seeds 10,000 employees; later boots keep the data.
# Reset everything with: docker compose down -v
#
# The secrets below are demo defaults for local use only. Override them via a .env
# file or the environment for anything shared.
name: salary-management

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salary}
      POSTGRES_DB: salary_management_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary_management_production"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://salary:${POSTGRES_PASSWORD:-salary}@db:5432/salary_management_production
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-demo-only-3f9a1c7e5b2d8f4a6c0e9b1d3f5a7c9e2b4d6f8a0c1e3b5d7f9a2c4e6b8d0f1a3}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-8c2e4a6f0b1d3e5f7a9c2b4d6e8f0a1c}
      FORCE_SSL: "false"            # plain HTTP on localhost; keep SSL on behind a real proxy
      SEED_IF_EMPTY: "1"            # seed demo data on first boot only
      ALLOW_DESTRUCTIVE_SEED: "1"   # the seed truncates tables, so production requires opting in
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-password123}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
