# Departments and their job ladders. Job titles are a closed list so that pay
# statistics group cleanly ("Sr. Engineer" vs "Senior Engineer" drift is one of
# the spreadsheet problems we are replacing). Level 1 = entry, 5 = director.
Engineering:
  - { title: Software Engineer I, level: 1 }
  - { title: Software Engineer II, level: 2 }
  - { title: Senior Software Engineer, level: 3 }
  - { title: Staff Software Engineer, level: 4 }
  - { title: Director of Engineering, level: 5 }
