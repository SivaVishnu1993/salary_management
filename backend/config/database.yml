# Local credentials default to postgres/postgres and can be overridden per machine
# via DB_HOST / DB_PORT / DB_USERNAME / DB_PASSWORD. Production uses DATABASE_URL.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  database: salary_management_development

test:
  <<: *default
  database: salary_management_test

# Production takes everything from DATABASE_URL (no local defaults inherited).
production:
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
